[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spinning-eye"
dynamic = ["version"]
description = "just spinning eye in your terminal"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
eye = "eye:main"

[project.urls]
Repository = "https://github.com/iwannasome/eye"

[tool.setuptools]
py-modules = ["eye"]

[tool.setuptools.dynamic]
version = {attr = "eye.__version__"}
